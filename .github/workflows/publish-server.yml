name: Publish Asherah Server

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0). Leave empty to use current commit.'
        required: false
        type: string

permissions:
  contents: read

# Serialize concurrent runs of this workflow on the same release tag
# (or per-branch for manual dispatches). Without this, a re-run can
# race the prior run and leave the registry in a half-pushed state.
concurrency:
  group: publish-server-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/asherah-server

jobs:
  verify-ci:
    permissions:
      contents: read
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          CHECKS="lint rust-tests integration-tests"
          MAX_WAIT=1200  # 20 minutes
          INTERVAL=30
          ELAPSED=0

          echo "Waiting for CI checks on ${SHA}..."
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            ALL_DONE=true
            FAILED=false
            for CHECK in $CHECKS; do
              CONCLUSION=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=${CHECK}" \
                --jq '.check_runs[0].conclusion // empty')
              if [ -z "$CONCLUSION" ]; then
                ALL_DONE=false
              elif [ "$CONCLUSION" != "success" ]; then
                echo "::error::CI check '${CHECK}' failed with '${CONCLUSION}' on ${SHA}."
                FAILED=true
              fi
            done

            if [ "$FAILED" = true ]; then exit 1; fi
            if [ "$ALL_DONE" = true ]; then
              echo "All CI checks passed on ${SHA}"
              exit 0
            fi

            echo "  CI still running... (${ELAPSED}s elapsed, checking again in ${INTERVAL}s)"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::error::CI did not complete within ${MAX_WAIT}s on ${SHA}."
          exit 1

  build-and-push:
    needs: [verify-ci]
    if: ${{ always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="sha-$(git rev-parse --short HEAD)"
          fi
          # Strip leading 'v' for semver tags
          SEMVER="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: asherah-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.semver }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=asherah-server
          # ignore-error=true: a transient GHA cache-export flake
          # ("error writing layer blob: not_found", which failed the v0.6.112
          # release) must not fail the build/push — the image is already built
          # and pushed by the time the cache export runs.
          cache-to: type=gha,mode=max,scope=asherah-server,ignore-error=true
          labels: |
            org.opencontainers.image.title=asherah-server
            org.opencontainers.image.description=gRPC sidecar server for Asherah envelope encryption
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Show image details
        run: |
          echo "=============================================="
          echo "asherah-server container image published"
          echo "=============================================="
          echo ""
          echo "Pull with:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          echo ""
          echo "Run with:"
          echo "  docker run --rm -v /tmp:/tmp ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \\"
          echo "    --service my-service --product my-product --kms static --metastore memory"
          echo ""
          echo "Platforms: linux/amd64, linux/arm64"
          echo "=============================================="
