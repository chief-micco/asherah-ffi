name: Publish to npm

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/ref to build from (default: current branch)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        type: boolean
        default: false

jobs:
  verify-ci:
    permissions:
      contents: read
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          CHECKS="lint rust-tests integration-tests"
          MAX_WAIT=1200  # 20 minutes
          INTERVAL=30
          ELAPSED=0

          echo "Waiting for CI checks on ${SHA}..."
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            ALL_DONE=true
            FAILED=false
            for CHECK in $CHECKS; do
              CONCLUSION=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=${CHECK}" \
                --jq '.check_runs[0].conclusion // empty')
              if [ -z "$CONCLUSION" ]; then
                ALL_DONE=false
              elif [ "$CONCLUSION" != "success" ]; then
                echo "::error::CI check '${CHECK}' failed with '${CONCLUSION}' on ${SHA}."
                FAILED=true
              fi
            done

            if [ "$FAILED" = true ]; then exit 1; fi
            if [ "$ALL_DONE" = true ]; then
              echo "All CI checks passed on ${SHA}"
              exit 0
            fi

            echo "  CI still running... (${ELAPSED}s elapsed, checking again in ${INTERVAL}s)"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::error::CI did not complete within ${MAX_WAIT}s on ${SHA}."
          exit 1

  build-bindings:
    permissions:
      contents: read
    needs: [verify-ci]
    if: ${{ always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build: |
              set -e
              npm ci
              npm run build -- --target x86_64-unknown-linux-gnu
              strip -x *.node
          - host: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            build: |
              set -e
              echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              rustup target add aarch64-unknown-linux-gnu
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
              export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              npm ci
              npm run build -- --target aarch64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
            build: |
              set -e
              rustup target add x86_64-apple-darwin
              npm ci
              npm run build -- --target x86_64-apple-darwin
              strip -x *.node
          - host: macos-latest
            target: aarch64-apple-darwin
            build: |
              set -e
              sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*
              export CC=$(xcrun -f clang)
              export CXX=$(xcrun -f clang++)
              SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
              export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
              npm ci
              npm run build -- --target aarch64-apple-darwin
              strip -x *.node
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: |
              set -e
              ARCH=x86_64 source "$GITHUB_WORKSPACE/scripts/download-musl-openssl.sh"
              cd "$GITHUB_WORKSPACE/asherah-node"
              rustup target add x86_64-unknown-linux-musl
              npm ci
              npm run build -- --target x86_64-unknown-linux-musl --zig
              strip -x *.node
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: |
              set -e
              ARCH=aarch64 source "$GITHUB_WORKSPACE/scripts/download-musl-openssl.sh"
              cd "$GITHUB_WORKSPACE/asherah-node"
              rustup target add aarch64-unknown-linux-musl
              npm ci
              npm run build -- --target aarch64-unknown-linux-musl --zig
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: |
              bash "$GITHUB_WORKSPACE/scripts/vcpkg-install-with-retry.sh" openssl:x64-windows-static-md
              export OPENSSL_DIR="C:/vcpkg/installed/x64-windows-static-md"
              # `OPENSSL_STATIC=1` matches the `static-md` triplet and the
              # ci.yml dry-run; without it the `openssl-sys` build script
              # picks up the import-library form and produces a binary
              # that needs `libcrypto-3-x64.dll` at runtime.
              export OPENSSL_STATIC=1
              export OPENSSL_NO_VENDOR=1
              npm ci
              npm run build -- --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: |
              bash "$GITHUB_WORKSPACE/scripts/vcpkg-install-with-retry.sh" openssl:arm64-windows-static-md
              export OPENSSL_DIR="C:/vcpkg/installed/arm64-windows-static-md"
              # See the x86_64 entry above — same parity rule.
              export OPENSSL_STATIC=1
              export OPENSSL_NO_VENDOR=1
              rustup target add aarch64-pc-windows-msvc
              npm ci
              npm run build -- --target aarch64-pc-windows-msvc

    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@32a995a99d743b9c19db6838def362cd715afeb6 # 1.91.1
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install Zig (musl builds, with retries)
        # See scripts/install-zig.sh for rationale (no-retry flake in
        # mlugg/setup-zig@v2 was blocking dry-runs in CI).
        if: contains(matrix.settings.target, 'musl')
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/install-zig.sh"

      - name: Install cargo-zigbuild (musl builds)
        if: contains(matrix.settings.target, 'musl')
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-zigbuild

      # Split into restore + save so a flaky post-job cache save (observed
      # on windows-arm64 in run 25086881584 — tar process died mid-step
      # with no error output) cannot mark the entire job as failed and
      # skip the dependent `publish` job.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Build
        working-directory: asherah-node
        shell: bash
        run: ${{ matrix.settings.build }}

      - name: Save cargo cache
        if: ${{ always() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: asherah-node/*.node
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-bindings
    # Without `always()`, this skips when any transitive `needs:` ancestor
    # was skipped — including `verify-ci`, which only runs for release
    # events. workflow_dispatch runs would otherwise build all bindings
    # then silently skip the publish step.
    if: ${{ always() && needs.build-bindings.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: bindings-*

      - name: List downloaded artifacts
        run: |
          ls -R artifacts/

      - name: Resolve version
        working-directory: asherah-node
        run: |
          # NPM_VERSION is the PATCH number only. The major.minor is hardcoded.
          PATCH="${{ vars.NPM_VERSION }}"
          if [ -n "$PATCH" ]; then
            VERSION="4.0.${PATCH}"
            NPM_TAG="latest"
          else
            # Fallback to beta versioning
            BETA="${{ vars.NPM_BETA_VERSION }}"
            if [ -z "$BETA" ]; then
              echo "::error::NPM_VERSION (patch number) is not set"
              exit 1
            fi
            while npm view "asherah@4.0.0-beta.${BETA}" version 2>/dev/null; do
              echo "asherah@4.0.0-beta.${BETA} already exists, trying next..."
              BETA=$(( BETA + 1 ))
            done
            VERSION="4.0.0-beta.${BETA}"
            NPM_TAG="beta"
            echo "NPM_BETA=${BETA}" >> "$GITHUB_ENV"
          fi

          echo "Publishing version: ${VERSION} with tag: ${NPM_TAG}"
          npm version "$VERSION" --no-git-tag-version
          echo "NPM_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "NPM_TAG=${NPM_TAG}" >> "$GITHUB_ENV"

      - name: Place bindings and set platform versions
        working-directory: asherah-node
        shell: bash
        run: |
          npm ci --ignore-scripts

          # Map Rust triples to napi platform directory names
          declare -A TRIPLE_MAP=(
            [x86_64-unknown-linux-gnu]=linux-x64-gnu
            [aarch64-unknown-linux-gnu]=linux-arm64-gnu
            [x86_64-unknown-linux-musl]=linux-x64-musl
            [aarch64-unknown-linux-musl]=linux-arm64-musl
            [x86_64-apple-darwin]=darwin-x64
            [aarch64-apple-darwin]=darwin-arm64
            [x86_64-pc-windows-msvc]=win32-x64-msvc
            [aarch64-pc-windows-msvc]=win32-arm64-msvc
          )

          for triple in "${!TRIPLE_MAP[@]}"; do
            platform="${TRIPLE_MAP[$triple]}"
            src="../artifacts/bindings-${triple}"
            dst="npm/${platform}"
            mkdir -p "$dst"
            node_file=$(find "$src" -name "*.node" -print -quit 2>/dev/null)
            if [ -n "$node_file" ]; then
              cp -v "$node_file" "$dst/index.${platform}.node"
            else
              echo "::warning::No binding found for ${triple}"
            fi
          done

          echo "Bindings placed:"
          ls -lh npm/*/index.*.node

          # Update version in all platform package.json files and main optionalDependencies
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ]; then
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('$dir/package.json', 'utf8'));
                pkg.version = '${NPM_VERSION}';
                fs.writeFileSync('$dir/package.json', JSON.stringify(pkg, null, 2) + '\n');
              "
              echo "Set $dir → ${NPM_VERSION}"
            fi
          done

          # Update optionalDependencies versions in main package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.optionalDependencies) {
              for (const dep of Object.keys(pkg.optionalDependencies)) {
                pkg.optionalDependencies[dep] = '${NPM_VERSION}';
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish platform packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: asherah-node
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # On retry, treat "version already published" as success (idempotent re-run).
          RETRY_SUCCESS_REGEX: "previously published version"
        run: |
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ] && ls "$dir"/*.node 1>/dev/null 2>&1; then
              echo "Publishing $(node -p "require('./$dir/package.json').name")@${NPM_VERSION}..."
              (cd "$dir" && bash "$GITHUB_WORKSPACE/scripts/retry.sh" 3 15 -- npm publish --access public)
            fi
          done

      - name: Publish to npm (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        working-directory: asherah-node
        shell: bash
        run: |
          echo "=== Platform packages ==="
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ] && ls "$dir"/*.node 1>/dev/null 2>&1; then
              echo "Would publish: $(node -p "require('./$dir/package.json').name")@${NPM_VERSION}"
              (cd "$dir" && npm pack && tar -tzf *.tgz)
            fi
          done
          echo ""
          echo "=== Main package ==="
          npm pack
          echo "Contents:"
          tar -tzf *.tgz
          echo "Dry run complete. Would publish version ${NPM_VERSION}."

      - name: Publish main package
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: asherah-node
        run: bash "$GITHUB_WORKSPACE/scripts/retry.sh" 3 15 -- npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # On retry, treat "version already published" as success (idempotent re-run).
          RETRY_SUCCESS_REGEX: "previously published version"

      - name: Update dist-tags
        if: ${{ github.event.inputs.dry_run != 'true' && env.NPM_TAG == 'latest' }}
        working-directory: asherah-node
        run: bash "$GITHUB_WORKSPACE/scripts/retry.sh" 3 10 -- npm dist-tag add "asherah@${NPM_VERSION}" next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update version variable
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "$NPM_TAG" = "beta" ] && [ -n "${NPM_BETA:-}" ]; then
            NEXT=$(( NPM_BETA + 1 ))
            gh variable set NPM_BETA_VERSION --body "$NEXT"
            echo "Set NPM_BETA_VERSION to ${NEXT}"
          elif [ "$NPM_TAG" = "latest" ]; then
            # NPM_VERSION is the patch number only — bump it
            PATCH=$(echo "$NPM_VERSION" | sed 's/^4\.0\.//')
            NEXT_PATCH=$(( PATCH + 1 ))
            gh variable set NPM_VERSION --body "$NEXT_PATCH"
            echo "Set NPM_VERSION to ${NEXT_PATCH} (next publish will be 4.0.${NEXT_PATCH})"
          fi
