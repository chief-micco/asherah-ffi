name: Release Asherah Native Library

permissions:
  contents: read

# Serialize concurrent runs against the same release tag so a re-run
# doesn't race with the in-progress upload of native artifacts to the
# GitHub Release. Manual dispatches serialize per branch.
concurrency:
  group: release-cobhan-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0). Leave empty to build from current commit.'
        required: false
        type: string
      upload_to_release:
        description: 'Upload artifacts to GitHub Release (requires existing release)'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-ci:
    permissions:
      contents: read
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          CHECKS="lint rust-tests integration-tests"
          MAX_WAIT=1200  # 20 minutes
          INTERVAL=30
          ELAPSED=0

          echo "Waiting for CI checks on ${SHA}..."
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            ALL_DONE=true
            FAILED=false
            for CHECK in $CHECKS; do
              CONCLUSION=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?check_name=${CHECK}" \
                --jq '.check_runs[0].conclusion // empty')
              if [ -z "$CONCLUSION" ]; then
                ALL_DONE=false
              elif [ "$CONCLUSION" != "success" ]; then
                echo "::error::CI check '${CHECK}' failed with '${CONCLUSION}' on ${SHA}."
                FAILED=true
              fi
            done

            if [ "$FAILED" = true ]; then exit 1; fi
            if [ "$ALL_DONE" = true ]; then
              echo "All CI checks passed on ${SHA}"
              exit 0
            fi

            echo "  CI still running... (${ELAPSED}s elapsed, checking again in ${INTERVAL}s)"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::error::CI did not complete within ${MAX_WAIT}s on ${SHA}."
          exit 1

  ensure-go-module-tag:
    permissions:
      contents: write
    needs: [verify-ci]
    if: ${{ github.event_name == 'release' && needs.verify-ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure asherah-go module tag exists for this release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_SHA="${{ github.sha }}"
          GO_TAG="asherah-go/${RELEASE_TAG}"

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag is empty."
            exit 1
          fi

          # For annotated tags, refs/tags/<tag> points at a tag object and
          # refs/tags/<tag>^{} points at the peeled commit.
          REMOTE_TAG_OBJECT_SHA="$(git ls-remote --tags origin "refs/tags/${GO_TAG}" | awk '{print $1}')"
          REMOTE_PEELED_SHA="$(git ls-remote --tags origin "refs/tags/${GO_TAG}^{}" | awk '{print $1}')"
          REMOTE_EFFECTIVE_SHA="${REMOTE_PEELED_SHA:-$REMOTE_TAG_OBJECT_SHA}"

          if [[ -n "${REMOTE_EFFECTIVE_SHA}" ]]; then
            echo "Found existing ${GO_TAG} -> ${REMOTE_EFFECTIVE_SHA}"
            if [[ "${REMOTE_EFFECTIVE_SHA}" != "${RELEASE_SHA}" ]]; then
              echo "::error::Tag ${GO_TAG} already exists on ${REMOTE_EFFECTIVE_SHA}, expected ${RELEASE_SHA}."
              exit 1
            fi
            echo "Tag already points at this release commit; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${GO_TAG}" "${RELEASE_SHA}" -m "Release ${GO_TAG}"
          git push origin "refs/tags/${GO_TAG}"
          echo "Created and pushed ${GO_TAG} -> ${RELEASE_SHA}"

  build:
    permissions:
      contents: read
    needs: [verify-ci, ensure-go-module-tag]
    if: ${{ always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped') && (needs.ensure-go-module-tag.result == 'success' || needs.ensure-go-module-tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — use ubuntu-22.04 for glibc 2.35 compat
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: libasherah_ffi.so
            asset_name: libasherah-x64.so
            arch: x64
          # Linux arm64 — use ubuntu-22.04 for glibc 2.35 compat
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact_name: libasherah_ffi.so
            asset_name: libasherah-arm64.so
            arch: arm64
            cross: true
          # Linux x86_64 musl (Alpine) — cargo-zigbuild + Alpine OpenSSL
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact_name: libasherah_ffi.so
            asset_name: libasherah-x64-musl.so
            arch: x64-musl
            musl: true
            musl_arch: x86_64
          # Linux arm64 musl (Alpine) — cargo-zigbuild + Alpine OpenSSL
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            artifact_name: libasherah_ffi.so
            asset_name: libasherah-arm64-musl.so
            arch: arm64-musl
            musl: true
            musl_arch: aarch64
          # macOS x86_64 — cross-compile from ARM64 via rustup target
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: libasherah_ffi.dylib
            asset_name: libasherah-x64.dylib
            arch: x64
          # macOS arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: libasherah_ffi.dylib
            asset_name: libasherah-arm64.dylib
            arch: arm64
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: asherah_ffi.dll
            asset_name: libasherah-x64.dll
            arch: x64
          # Windows arm64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: asherah_ffi.dll
            asset_name: libasherah-arm64.dll
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@32a995a99d743b9c19db6838def362cd715afeb6 # 1.91.1
        with:
          targets: ${{ matrix.target }}

      # Split into restore + save so a flaky post-job cache save cannot
      # mark the entire matrix entry as failed and skip `package` /
      # `upload-release` (no release would ship). See windows-arm64
      # incident in run 25086881584.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-ffi-

      - name: Install cross-compile tools (Linux arm64)
        if: matrix.cross == true
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install aarch64 strip tool (musl arm64)
        if: matrix.musl == true && matrix.musl_arch == 'aarch64'
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Install Zig (musl builds, with retries)
        # See scripts/install-zig.sh for rationale (no-retry flake in
        # mlugg/setup-zig@v2 was blocking dry-runs in CI).
        if: matrix.musl == true
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/install-zig.sh"

      - name: Install cargo-zigbuild (musl builds)
        if: matrix.musl == true
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-zigbuild

      - name: Setup musl OpenSSL (musl builds)
        if: matrix.musl == true
        shell: bash
        run: |
          ARCH=${{ matrix.musl_arch }} source "$GITHUB_WORKSPACE/scripts/download-musl-openssl.sh"
          {
            echo "OPENSSL_DIR=$OPENSSL_DIR"
            echo "OPENSSL_STATIC=$OPENSSL_STATIC"
            echo "OPENSSL_NO_VENDOR=$OPENSSL_NO_VENDOR"
          } >> "$GITHUB_ENV"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build asherah-ffi (glibc / macOS / Windows)
        if: matrix.musl != true
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.cross && 'aarch64-linux-gnu-g++' || '' }}
          AR_aarch64_unknown_linux_gnu: ${{ matrix.cross && 'aarch64-linux-gnu-ar' || '' }}
        run: |
          cargo build --release -p asherah-ffi -p asherah-java --target ${{ matrix.target }}

      - name: Build asherah-ffi (musl)
        if: matrix.musl == true
        # Rust defaults *-unknown-linux-musl to +crt-static, which silently
        # drops the cdylib output ("dropping unsupported crate type cdylib
        # for target ..."). Disable crt-static so cargo-zigbuild produces
        # a real .so for asherah-ffi / asherah-java / asherah-cobhan.
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          cargo zigbuild --release -p asherah-ffi -p asherah-java --target ${{ matrix.target }}

      - name: Save cargo cache
        if: ${{ always() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          case '${{ matrix.target }}' in
            aarch64-*-linux-*)
              aarch64-linux-gnu-strip -x target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
              ;;
            *)
              strip -x target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
              ;;
          esac

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          # Also include the Java JNI library (same extension, different name)
          JAVA_LIB="target/${{ matrix.target }}/release/$(echo '${{ matrix.artifact_name }}' | sed 's/asherah_ffi/asherah_java/')"
          if [ -f "$JAVA_LIB" ]; then
            JAVA_ASSET="$(echo '${{ matrix.asset_name }}' | sed 's/libasherah-/libasherah_java-/')"
            cp "$JAVA_LIB" "artifacts/$JAVA_ASSET"
          fi

      - name: Generate header file
        shell: bash
        run: |
          cat > artifacts/libasherah-${{ matrix.arch }}.h << 'EOF'
          /* libasherah - C ABI for Asherah encryption library
           *
           * This header is compatible with both Go and Rust implementations.
           * Drop-in replacement for github.com/godaddy/asherah-cobhan
           */
          #ifndef LIBASHERAH_H
          #define LIBASHERAH_H

          #include <stdint.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          /* Error codes */
          #define ERR_NONE                  0
          #define ERR_NULL_PTR             -1
          #define ERR_BUFFER_TOO_LARGE     -2
          #define ERR_BUFFER_TOO_SMALL     -3
          #define ERR_COPY_FAILED          -4
          #define ERR_JSON_DECODE_FAILED   -5
          #define ERR_JSON_ENCODE_FAILED   -6
          #define ERR_INVALID_UTF8         -7
          #define ERR_READ_TEMP_FILE_FAILED -8
          #define ERR_WRITE_TEMP_FILE_FAILED -9
          #define ERR_NOT_INITIALIZED      -100
          #define ERR_ALREADY_INITIALIZED  -101
          #define ERR_GET_SESSION_FAILED   -102
          #define ERR_ENCRYPT_FAILED       -103
          #define ERR_DECRYPT_FAILED       -104
          #define ERR_BAD_CONFIG           -105
          #define ERR_PANIC                -106

          /* Cobhan buffer format:
           * - Bytes 0-3: int32_t length (little-endian)
           * - Bytes 4-7: int32_t capacity (little-endian, for output buffers)
           * - Bytes 8+:  data payload
           */

          void Shutdown(void);
          int32_t SetEnv(void* envJson);
          int32_t SetupJson(void* configJson);
          int32_t EstimateBuffer(int32_t dataLen, int32_t partitionLen);

          int32_t Encrypt(
              void* partitionId,
              void* data,
              void* encryptedData,
              void* encryptedKey,
              void* created,
              void* parentKeyId,
              void* parentKeyCreated
          );

          int32_t Decrypt(
              void* partitionId,
              void* encryptedData,
              void* encryptedKey,
              int64_t created,
              void* parentKeyId,
              int64_t parentKeyCreated,
              void* data
          );

          int32_t EncryptToJson(void* partitionId, void* data, void* jsonOutput);
          int32_t DecryptFromJson(void* partitionId, void* jsonInput, void* dataOutput);

          #ifdef __cplusplus
          }
          #endif

          #endif /* LIBASHERAH_H */
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libasherah-${{ matrix.arch }}-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # Create a combined artifact with all platforms
  package:
    permissions:
      contents: read
    needs: build
    # Without `if: always()`, this job is skipped whenever any transitive
    # `needs:` ancestor was skipped — including `verify-ci`, which only runs
    # for release events. workflow_dispatch runs would then silently produce
    # no combined tarball.
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: libasherah-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/

      - name: Create tarball
        run: |
          cd artifacts
          tar -czvf ../libasherah-all-platforms.tar.gz .

      - name: Upload combined artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libasherah-all-platforms
          path: libasherah-all-platforms.tar.gz
          retention-days: 7

  # Upload to GitHub Release (only on release event or when explicitly requested)
  upload-release:
    needs: build
    # `always()` is required so this runs when `verify-ci` was skipped
    # (workflow_dispatch path); the dispatch input check stays the same.
    if: ${{ always() && needs.build.result == 'success' && (github.event_name == 'release' || inputs.upload_to_release == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: libasherah-*
          merge-multiple: true

      - name: List artifacts for upload
        run: |
          echo "=== Artifacts to upload ==="
          ls -la artifacts/

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum libasherah-*.so libasherah-*.dylib libasherah-*.dll 2>/dev/null > SHA256SUMS || true
          cat SHA256SUMS

      - name: Create combined tarball
        run: |
          cd artifacts
          tar -czvf ../libasherah-all-platforms.tar.gz .

      - name: Upload to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/libasherah-x64.so
            artifacts/libasherah-arm64.so
            artifacts/libasherah-x64-musl.so
            artifacts/libasherah-arm64-musl.so
            artifacts/libasherah-x64.dylib
            artifacts/libasherah-arm64.dylib
            artifacts/libasherah-x64.dll
            artifacts/libasherah-arm64.dll
            artifacts/libasherah_java-x64.so
            artifacts/libasherah_java-arm64.so
            artifacts/libasherah_java-x64-musl.so
            artifacts/libasherah_java-arm64-musl.so
            artifacts/libasherah_java-x64.dylib
            artifacts/libasherah_java-arm64.dylib
            artifacts/libasherah_java-x64.dll
            artifacts/libasherah_java-arm64.dll
            artifacts/libasherah-x64.h
            artifacts/libasherah-arm64.h
            artifacts/SHA256SUMS
            libasherah-all-platforms.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Output download URLs (for documentation)
  show-urls:
    permissions:
      contents: read
    needs: upload-release
    if: ${{ always() && needs.upload-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Show download URLs
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          REPO="${{ github.repository }}"
          echo ""
          echo "=============================================="
          echo "libasherah Download URLs (Drop-in compatible)"
          echo "=============================================="
          echo ""
          echo "Linux x86_64 (glibc):"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-x64.so"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-x64.h"
          echo ""
          echo "Linux arm64 (glibc):"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-arm64.so"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-arm64.h"
          echo ""
          echo "Linux x86_64 (musl / Alpine):"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-x64-musl.so"
          echo ""
          echo "Linux arm64 (musl / Alpine):"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-arm64-musl.so"
          echo ""
          echo "macOS x86_64:"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-x64.dylib"
          echo ""
          echo "macOS arm64 (Apple Silicon):"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-arm64.dylib"
          echo ""
          echo "Windows x86_64:"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-x64.dll"
          echo ""
          echo "Windows arm64:"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-arm64.dll"
          echo ""
          echo "Checksums:"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS"
          echo ""
          echo "All platforms (tarball):"
          echo "  https://github.com/${REPO}/releases/download/${TAG}/libasherah-all-platforms.tar.gz"
          echo ""
          echo "=============================================="
